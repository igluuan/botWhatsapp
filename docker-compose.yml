services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/dev.db
      WHATSAPP_AUTH_DIR: /app/.baileys_auth
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth_data:/app/.baileys_auth
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  whatsapp_auth_data:
  sqlite_data:
